[package]
name = "cs2-tracker"
version = "0.6.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
steam-vent = "0.5"
steam-vent-proto = "0.5"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "twilight-http", "zlib"] }
twilight-http = { version = "0.17", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
