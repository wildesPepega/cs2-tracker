name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # Alpine builds a fully static musl binary that runs on any Linux / Pterodactyl image.
      - name: Build static binary
        run: |
          docker run --rm -v "$PWD":/src -w /src rust:1-alpine sh -c \
            "apk add --no-cache musl-dev build-base perl && cargo build --release --locked"
          sudo cp target/release/cs2-tracker cs2-tracker-linux-${{ matrix.arch }}
          file cs2-tracker-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-tracker-linux-${{ matrix.arch }}
          path: cs2-tracker-linux-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cs2-tracker-linux-* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
